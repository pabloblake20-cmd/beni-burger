<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>Beni Burger | Pedidos</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#111;font-family:Arial,sans-serif}header{background:#111;color:#fff;padding:22px;text-align:center;position:sticky;top:0;z-index:5}.logo{font-size:31px;font-weight:900}.tag{color:#ddd;font-size:14px;margin-top:4px}main{max-width:720px;margin:auto;padding:16px 16px 120px}.hero{background:#111;color:#fff;border-radius:20px;padding:22px;margin-bottom:20px}.hero h1{margin:0 0 7px;font-size:25px}.hero p{margin:0;color:#ddd}h2{font-size:21px;margin:24px 2px 10px}.card{background:#fff;border:1px solid #e8e8e8;border-radius:17px;padding:15px;margin:10px 0;display:flex;gap:13px;align-items:center}.info{flex:1}.name{font-weight:800;font-size:17px}.desc{font-size:13px;color:#707070;margin:5px 0 7px;line-height:1.35}.price{font-weight:900;font-size:17px}button{cursor:pointer}.add,.cartbtn{border:0;background:#111;color:#fff;border-radius:12px;padding:12px 14px;font-weight:800}.cartbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:11px 14px;z-index:10}.cartin{max-width:720px;margin:auto;display:flex;align-items:center;justify-content:space-between}.cartinfo{font-size:13px;color:#555}.carttotal{display:block;color:#111;font-size:19px;font-weight:900}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:20;padding:15px}.box{background:#fff;border-radius:20px;max-width:620px;margin:15px auto;padding:20px;max-height:92vh;overflow:auto}.close{float:right;border:0;background:#eee;border-radius:10px;padding:7px 10px;font-size:18px}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #eee}.qty{display:flex;gap:5px;align-items:center;margin-top:6px}.qty button{border:0;background:#eee;border-radius:8px;padding:5px 9px}input,select,textarea{width:100%;padding:13px;border:1px solid #d8d8d8;border-radius:11px;font-size:16px;margin:5px 0 12px}label{font-size:13px;font-weight:700}.actions{display:flex;gap:9px}.actions button{flex:1;padding:13px;border:0;border-radius:12px;font-weight:900}.cancel{background:#eee}.send{background:#159447;color:#fff}.empty{text-align:center;color:#777;padding:20px}
</style></head><body>
<header><div class="logo">BENI BURGER</div><div class="tag">Pedidos online 🍔</div></header>
<main><section class="hero"><h1>Pedí tu Beni Burger</h1><p>Elegí tus productos, completá tus datos y enviá el pedido por WhatsApp.</p></section><div id="menu"></div></main>
<div class="cartbar"><div class="cartin"><div class="cartinfo"><span id="count">0</span> productos<span class="carttotal" id="total">$0</span></div><button class="cartbtn" onclick="openCart()">Ver pedido</button></div></div>
<div class="modal" id="modal"><div class="box"><button class="close" onclick="closeCart()">×</button><h2 style="margin-top:0">Tu pedido</h2><div id="order"></div><hr>
<label>Nombre</label><input id="name" placeholder="Tu nombre"><label>Teléfono</label><input id="phone" inputmode="tel" placeholder="Tu teléfono">
<label>Entrega</label><select id="type" onchange="toggleAddress()"><option value="delivery">Delivery</option><option value="pickup">Retiro en el local</option></select>
<div id="addressWrap"><label>Dirección</label><input id="address" placeholder="Calle y número"></div>
<label>Forma de pago</label><select id="payment"><option>Efectivo</option><option>Transferencia</option><option>Mercado Pago</option></select>
<label>Observaciones</label><textarea id="note" rows="3" placeholder="Ej.: sin cebolla..."></textarea>
<div class="actions"><button class="cancel" onclick="closeCart()">Seguir comprando</button><button class="send" onclick="sendOrder()">Enviar pedido</button></div></div></div>
<script>
const WHATSAPP="542616310221";
const products=[
["Hamburguesa Doble","Doble cheddar, panceta, cebolla caramelizada, pan de papa + papas. Salsa a elección.",12000,"Hamburguesas"],
["Promo 2 Hamburguesas","2 hamburguesas dobles.",23000,"Hamburguesas"],
["Empanadas de Carne","Docena.",11500,"Empanadas"],
["Empanadas de Jamón y Queso","Docena.",12500,"Empanadas"],
["Pizza Muzza","",8000,"Pizzas"],["Pizza Especial","Jamón y morrón.",9000,"Pizzas"],["Pizza Jamón y Huevo","",9600,"Pizzas"],["Pizza Fugazzetta","",8500,"Pizzas"],
["Promo 1","Muzza + especial jamón.",16500,"Promos"],["Promo 2","Jamón y huevo + fugazzetta.",17600,"Promos"],["Promo 3","2 pizzas muzza.",15500,"Promos"],["Promo 4","1 docena de carne + 1 docena de jamón y queso.",23000,"Promos"]];
let cart={}; const money=n=>"$"+n.toLocaleString("es-AR");
function render(){let cats=[...new Set(products.map(p=>p[3]))];document.getElementById("menu").innerHTML=cats.map(c=>`<section><h2>${c}</h2>${products.map((p,i)=>p[3]==c?`<div class="card"><div class="info"><div class="name">${p[0]}</div><div class="desc">${p[1]}</div><div class="price">${money(p[2])}</div></div><button class="add" onclick="add(${i})">Agregar</button></div>`:"").join("")}</section>`).join("");update()}
function add(i){cart[i]=(cart[i]||0)+1;update();openCart()} function update(){let q=Object.values(cart).reduce((a,b)=>a+b,0),t=Object.entries(cart).reduce((s,[i,q])=>s+products[i][2]*q,0);count.textContent=q;total.textContent=money(t)}
function openCart(){modal.style.display="block";renderOrder()} function closeCart(){modal.style.display="none"}
function change(i,d){cart[i]=(cart[i]||0)+d;if(cart[i]<=0)delete cart[i];update();renderOrder()}
function renderOrder(){let e=Object.entries(cart);if(!e.length){order.innerHTML='<div class="empty">Todavía no agregaste productos.</div>';return}let t=e.reduce((s,[i,q])=>s+products[i][2]*q,0);order.innerHTML=e.map(([i,q])=>`<div class="row"><div><b>${products[i][0]}</b><div class="qty"><button onclick="change(${i},-1)">−</button>${q}<button onclick="change(${i},1)">+</button></div></div><b>${money(products[i][2]*q)}</b></div>`).join("")+`<div class="row"><b>Total</b><b>${money(t)}</b></div>`}
function toggleAddress(){addressWrap.style.display=type.value==="delivery"?"block":"none"}
function sendOrder(){if(!Object.keys(cart).length)return alert("Agregá al menos un producto.");let n=name.value.trim(),ph=phone.value.trim(),ad=address.value.trim();if(!n||!ph)return alert("Completá nombre y teléfono.");if(type.value==="delivery"&&!ad)return alert("Completá la dirección.");let num="BB-"+Date.now().toString().slice(-6),lines=[`*BENI BURGER - PEDIDO ${num}*`,"",`Cliente: ${n}`,`Teléfono: ${ph}`,type.value==="delivery"?`Delivery: ${ad}`:"Retiro en el local",`Pago: ${payment.value}`,""];let t=0;Object.entries(cart).forEach(([i,q])=>{t+=products[i][2]*q;lines.push(`${q} x ${products[i][0]} - ${money(products[i][2]*q)}`)});lines.push("",`*TOTAL: ${money(t)}*`);if(note.value.trim())lines.push(`Observaciones: ${note.value.trim()}`);const url="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(lines.join("\n")); window.location.href=url}
toggleAddress();render();
</script></body></html>
