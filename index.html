<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>Beni Burger | Pedidos</title>
<style>
:root{--bg:#0b0b0b;--card:#171717;--line:#303030;--o:#f5a623;--g:#25d366}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}header{position:sticky;top:0;z-index:5;background:#0b0b0bf5;border-bottom:1px solid #292929}.top,main,.hero,.tabs{max-width:760px;margin:auto}.top{padding:9px 14px;display:flex;gap:11px;align-items:center}.logo{width:58px;height:58px;object-fit:cover;border-radius:15px}.brand{font-weight:900;font-size:21px}.tag{font-size:11px;color:#aaa}.hero{padding:14px}.hero img{width:100%;height:300px;object-fit:cover;border-radius:22px}.hero h1{font-size:30px;margin:15px 0 5px}.hero p{color:#aaa}.pill{display:inline-block;padding:6px 9px;border:1px solid #59451e;border-radius:99px;color:#ffbd43;font-size:11px;font-weight:900}.tabs{position:sticky;top:77px;z-index:4;background:#0b0b0b;padding:9px 14px;display:flex;gap:8px;overflow:auto}.tabs button{white-space:nowrap;border:1px solid #333;background:#171717;color:#ddd;border-radius:99px;padding:10px 14px;font-weight:800}.tabs .active{background:var(--o);color:#111}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin:12px 14px}.card img{width:100%;height:230px;object-fit:cover}.body{padding:14px}.row{display:flex;justify-content:space-between;gap:10px}.price{color:#ffb52e;font-weight:900;font-size:19px}.desc{color:#aaa;font-size:13px;line-height:1.4;margin:7px 0 12px}.add{width:100%;border:0;border-radius:12px;background:var(--o);color:#111;padding:12px;font-weight:900}.simple{margin:9px 14px;padding:13px;border:1px solid var(--line);background:var(--card);border-radius:16px;display:flex;justify-content:space-between;gap:10px}.simple small{display:block;color:#999;margin-top:4px}.simple button{background:var(--o);border:0;border-radius:9px;padding:9px;font-weight:900}.cart{position:fixed;bottom:0;left:0;right:0;background:#090909f7;border-top:1px solid #333;padding:11px 13px;z-index:10}.ci{max-width:760px;margin:auto;display:flex;align-items:center;gap:10px}.ct{flex:1}.checkout,.send{border:0;background:var(--g);padding:13px 15px;border-radius:12px;font-weight:900}.modal{display:none;position:fixed;inset:0;background:#000c;z-index:20;padding:15px;overflow:auto}.modal.open{display:block}.box{max-width:620px;margin:20px auto;background:#171717;border:1px solid #333;border-radius:20px;padding:17px}.close{float:right;background:#292929;color:#fff;border:0;border-radius:50%;width:35px;height:35px;font-size:20px}.choice{display:flex;gap:8px;align-items:center;border:1px solid #333;background:#101010;border-radius:11px;padding:10px;margin:7px 0}.choice input{width:18px;height:18px;accent-color:var(--o)}.choice span{flex:1}.choice b{color:#ffb52e}label{display:block;color:#ddd;font-size:13px;margin-top:12px}input,select,textarea{width:100%;margin-top:5px;background:#0c0c0c;color:#fff;border:1px solid #3a3a3a;border-radius:10px;padding:11px;font-size:15px}textarea{min-height:75px}.qty{display:flex;gap:12px;align-items:center;margin:13px 0}.qty button{width:38px;height:38px;background:#292929;color:#fff;border:0;border-radius:9px;font-size:20px}.total{border-top:1px solid #333;padding-top:12px;margin-top:10px;display:flex;justify-content:space-between;font-size:20px;font-weight:900}.send{width:100%;margin-top:15px}.line{padding:11px 0;border-bottom:1px solid #333}.line small{color:#999}.remove{float:right;background:#292929;color:#fff;border:0;border-radius:7px;padding:6px}.empty{text-align:center;color:#999;padding:20px}
</style></head><body>
<header><div class="top"><img class="logo" src="assets/logo.jpg"><div><div class="brand">Beni Burger</div><div class="tag">MÁS SABOR. MÁS BURGER.</div></div></div></header>
<section class="hero"><img src="assets/burger.jpg"><h1>Pedí tu burger 🍔</h1><p>Personalizá tu hamburguesa con adicionales antes de agregarla al pedido.</p><span class="pill">PEDIDOS ONLINE</span></section>
<nav class="tabs" id="tabs"></nav><main id="menu"></main>
<div class="cart"><div class="ci"><div class="ct"><b id="count">0 productos</b><br><small id="total">$0</small></div><button class="checkout" onclick="openCart()">VER PEDIDO</button></div></div>
<div class="modal" id="pm"><div class="box"><button class="close" onclick="closeM('pm')">×</button><h2 id="pt"></h2><p id="pd" style="color:#aaa"></p><b>ADICIONALES</b><div id="ex"></div><div class="qty"><button onclick="q(-1)">−</button><b id="qn">1</b><button onclick="q(1)">+</button></div><div class="total"><span>Total</span><span id="ptotal">$0</span></div><button class="send" onclick="addConfigured()">AGREGAR AL PEDIDO</button></div></div>
<div class="modal" id="cm"><div class="box"><button class="close" onclick="closeM('cm')">×</button><h2>Tu pedido</h2><div id="items"></div><div class="total"><span>Total</span><span id="ctotal">$0</span></div><label>Nombre<input id="name"></label><label>Teléfono<input id="phone"></label><label>Entrega<select id="delivery"><option>Retiro por el local</option><option>Delivery</option></select></label><label>Forma de pago<select id="pay"><option>Efectivo</option><option>Transferencia</option><option>Mercado Pago</option></select></label><label>Dirección / observaciones<textarea id="addr"></textarea></label><button class="send" onclick="send()">ENVIAR PEDIDO POR WHATSAPP</button></div></div>
<script>
const WA="542616310221", money=n=>"$"+n.toLocaleString("es-AR");
const extras=[["cheddar","Cheddar extra",1000],["bacon","Bacon extra",1500],["huevo","Huevo",800],["cebolla","Cebolla caramelizada extra",500],["salsa","Salsa extra",500]];
const products=[
["doble","Hamburguesa Doble","Hamburguesas",12000,"Doble medallón, doble cheddar, panceta, cebolla caramelizada, pan de papa, papas y salsa.","assets/burger.jpg"],
["2doble","2 Hamburguesas Dobles","Promos",23000,"Dos Beni Burger Doble.","assets/burger.jpg"],
["muzza","Muzza","Pizzas",8000,"Pizza muzzarella.","assets/burger.jpg"],
["especial","Especial Jamón y Morrón","Pizzas",9000,"Pizza especial con jamón y morrón.","assets/burger.jpg"],
["jyh","Jamón y Huevo","Pizzas",9600,"Pizza con jamón y huevo.","assets/burger.jpg"],
["fuga","Fugazzetta","Pizzas",8500,"Fugazzetta.","assets/burger.jpg"],
["carne","Empanadas de Carne x12","Empanadas",11500,"Docena de carne.","assets/burger.jpg"],
["jyq","Empanadas de Jamón y Queso x12","Empanadas",12500,"Docena de jamón y queso.","assets/burger.jpg"],
["p1","Muzza + Especial","Promos",16500,"1 muzza + 1 especial jamón y morrón.","assets/burger.jpg"],
["p2","Jamón y Huevo + Fugazzetta","Promos",17600,"1 jamón y huevo + 1 fugazzetta.","assets/burger.jpg"],
["p3","2 Muzza","Promos",15500,"2 pizzas muzza.","assets/burger.jpg"],
["p4","Docena Carne + Docena JyQ","Promos",23000,"1 docena carne + 1 docena jamón y queso.","assets/burger.jpg"]];
let cart=[],sel=null,qty=1;
const cats=["Todos",...new Set(products.map(p=>p[2]))];
tabs.innerHTML=cats.map((c,i)=>`<button class="${i?'':'active'}" onclick="cat('${c}',this)">${c}</button>`).join("");
function cat(c,b){document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active");render(c==="Todos"?products:products.filter(p=>p[2]===c))}
function render(list){menu.innerHTML=list.map(p=>p[2]==="Hamburguesas"||p[0]==="2doble"?`<article class="card"><img src="${p[5]}"><div class="body"><div class="row"><h3>${p[1]}</h3><b class="price">${money(p[3])}</b></div><div class="desc">${p[4]}</div><button class="add" onclick="openP('${p[0]}')">ELEGIR Y PERSONALIZAR</button></div></article>`:`<div class="simple"><div><b>${p[1]}</b><small>${p[4]}</small></div><div><b>${money(p[3])}</b><br><button onclick="simple('${p[0]}')">AGREGAR</button></div></div>`).join("")}
function openP(id){sel=products.find(p=>p[0]===id);qty=1;pt.textContent=sel[1];pd.textContent=sel[4];qn.textContent=1;ex.innerHTML=extras.map(e=>`<div class="choice"><input type="checkbox" id="${e[0]}" onchange="calc()"><span>${e[1]}</span><b>+${money(e[2])}</b></div>`).join("");calc();pm.classList.add("open")}
function q(n){qty=Math.max(1,qty+n);qn.textContent=qty;calc()}
function calc(){let a=extras.filter(e=>document.getElementById(e[0])?.checked).reduce((s,e)=>s+e[2],0);ptotal.textContent=money((sel[3]+a)*qty)}
function addConfigured(){let es=extras.filter(e=>document.getElementById(e[0])?.checked),u=sel[3]+es.reduce((s,e)=>s+e[2],0);cart.push({name:sel[1],qty,u,es:es.map(e=>e[1])});update();closeM("pm")}
function simple(id){let p=products.find(x=>x[0]===id);cart.push({name:p[1],qty:1,u:p[3],es:[]});update()}
function update(){let n=cart.reduce((s,x)=>s+x.qty,0),t=cart.reduce((s,x)=>s+x.u*x.qty,0);count.textContent=n+" producto"+(n===1?"":"s");total.textContent=money(t)}
function openCart(){items.innerHTML=cart.length?cart.map((x,i)=>`<div class="line"><button class="remove" onclick="cart.splice(${i},1);update();openCart()">Eliminar</button><b>${x.qty} × ${x.name}</b><br>${x.es.length?`<small>+ ${x.es.join(", ")}</small><br>`:""}<small>${money(x.u*x.qty)}</small></div>`).join(""):`<div class="empty">Todavía no agregaste productos.</div>`;ctotal.textContent=money(cart.reduce((s,x)=>s+x.u*x.qty,0));cm.classList.add("open")}
function closeM(id){document.getElementById(id).classList.remove("open")}
function send(){if(!cart.length)return alert("Agregá un producto.");if(!name.value.trim())return alert("Escribí tu nombre.");let m="🍔 *PEDIDO BENI BURGER*%0A%0A👤 Nombre: "+encodeURIComponent(name.value.trim())+"%0A";if(phone.value.trim())m+="📱 Teléfono: "+encodeURIComponent(phone.value.trim())+"%0A";m+="🚚 Entrega: "+encodeURIComponent(delivery.value)+"%0A💳 Pago: "+encodeURIComponent(pay.value)+"%0A";if(addr.value.trim())m+="📍 Indicaciones: "+encodeURIComponent(addr.value.trim())+"%0A";m+="%0A*PRODUCTOS*%0A";cart.forEach(x=>{m+=encodeURIComponent(x.qty+" x "+x.name)+" — "+encodeURIComponent(money(x.u*x.qty))+"%0A";if(x.es.length)m+="   + "+encodeURIComponent(x.es.join(", "))+"%0A"});m+="%0A💰 *TOTAL: "+encodeURIComponent(money(cart.reduce((s,x)=>s+x.u*x.qty,0)))+"*";open("https://wa.me/"+WA+"?text="+m,"_blank")}
render(products);update();
</script></body></html>
